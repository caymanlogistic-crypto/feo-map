name: Deploy maptest

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php -l maptest.php
          find map_files -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validate forbidden production files are not tracked
        run: |
          test ! -f map2.php
          test ! -f config.php
          test ! -f menu2.php
          test ! -f get_planned_routes.php
          test ! -f save_planned_route.php
          test ! -f delete_planned_route.php

      - name: Validate JS has no PHP fragments
        run: |
          ! grep -R -F "<?php" map_files/assets/*.js
          ! grep -R -F "<?=" map_files/assets/*.js
          ! grep -R -F "?>" map_files/assets/*.js

      - name: Validate maptest JS exists
        run: |
          test -f map_files/assets/maptest.js
          grep -q "window.MAP_BOOTSTRAP" map_files/Views/scripts.php
          grep -q "maptest.js" map_files/Views/scripts.php

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify deploy path is safe
        run: |
          if [ "${{ secrets.DEPLOY_PATH }}" != "/home/s/spugovxsim/public_html/fregat/feo" ]; then
            echo "Invalid DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}"
            exit 1
          fi

      - name: Deploy to server
        run: |
          set -e
          if ! rsync -az --delete \
            --exclude "map2.php" \
            --exclude "config.php" \
            --exclude "menu2.php" \
            --exclude ".git" \
            --exclude ".github" \
            -e "ssh -i ~/.ssh/deploy_key" \
            maptest.php map_files CODEX_WORKFLOW_RULES.md \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"; then
            echo "rsync failed, using scp fallback"
            ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p '${{ secrets.DEPLOY_PATH }}'"
            scp -i ~/.ssh/deploy_key maptest.php CODEX_WORKFLOW_RULES.md "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
            scp -i ~/.ssh/deploy_key -r map_files "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          fi

      - name: Server syntax check after deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "/usr/bin/php8.4 -l /home/s/spugovxsim/public_html/fregat/feo/maptest.php && \
             find /home/s/spugovxsim/public_html/fregat/feo/map_files -name '*.php' -print0 | xargs -0 -n1 /usr/bin/php8.4 -l"

      - name: Server readback verification
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -f /home/s/spugovxsim/public_html/fregat/feo/maptest.php && \
             test -f /home/s/spugovxsim/public_html/fregat/feo/map_files/assets/maptest.js && \
             grep -q 'maptest.js' /home/s/spugovxsim/public_html/fregat/feo/map_files/Views/scripts.php && \
             grep -q 'MAP_BOOTSTRAP' /home/s/spugovxsim/public_html/fregat/feo/map_files/Views/scripts.php"

      - name: Reset PHP OPcache if available
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "/usr/bin/php8.4 -r \"if (function_exists('opcache_reset')) { opcache_reset(); echo 'OPcache reset OK'; } else { echo 'No OPcache'; }\""

      - name: Runtime smoke check
        run: |
          curl -fsSL "http://spugovxsim.temp.swtest.ru/fregat/feo/maptest.php?t=github_${GITHUB_SHA}" | grep -q "MAP_BOOTSTRAP"
